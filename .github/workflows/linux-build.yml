name: Build Debian Kernel 6.12.113 amd64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build kernel with AtomISP drivers
    runs-on: ubuntu-latest
    timeout-minutes: 360

    container:
      image: debian:trixie

    steps:
      - name: Enable Debian Trixie Security repository
        shell: bash
        run: |
          set -eux

          cat > /etc/apt/sources.list.d/trixie-security.list <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main
          deb-src http://security.debian.org/debian-security trixie-security main
          EOF

          # Ensure source packages are available from the regular Trixie repository.
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i '/^Types:/ {
              /deb-src/! s/$/ deb-src/
            }' /etc/apt/sources.list.d/debian.sources
          elif [ -f /etc/apt/sources.list ]; then
            sed -i '/^deb /s/^deb /deb-src /' /etc/apt/sources.list
          fi

          apt-get update

          echo "Checking requested source version:"
          apt-cache showsrc linux | grep -F 'Version: 6.12.113-1'

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            devscripts \
            dpkg-dev \
            fakeroot \
            debhelper \
            bc \
            bison \
            flex \
            rsync \
            kmod \
            cpio \
            xz-utils \
            zstd \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-yaml \
            python3-jinja2 \
            python3-packaging \
            quilt

          DEBIAN_FRONTEND=noninteractive \
            apt-get build-dep -y linux=6.12.113-1

      - name: Download Linux source
        shell: bash
        run: |
          set -eux

          apt-get source linux=6.12.113-1
          test -d linux-6.12.113

      - name: Configure requested kernel modules
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -eux

          # 1. Генерируем базовые правила сборки Debian
          debian/rules source

          # 2. Создаем базовый конфиг для нужного флейвора (amd64)
          DEB_RULES_REQUIRES_ROOT=no \
            make -f debian/rules.gen setup_amd64_none_amd64

          BUILD_DIR="debian/build/build_amd64_none_amd64"
          CONFIG="$BUILD_DIR/.config"

          test -f "$CONFIG"

          # 3. Переходим в директорию билда, где лежит .config
          cd "$BUILD_DIR"

          # 4. Включаем модули и их базовые подсистемы через штатный скрипт ядра.
          # Именно так предписывает делать Debian Kernel Handbook (раздел 4.5.3).
          ../../../../scripts/config \
            --enable CONFIG_INTEL_ATOMISP \
            --module CONFIG_INTEL_BYTCRC_PWRSRC \
            --module CONFIG_INTEL_PUNIT_IPC \
            --module CONFIG_VIDEO_ATOMISP \
            --module CONFIG_VIDEO_ATOMISP_GC2235 \
            --enable CONFIG_MEDIA_SUPPORT \
            --enable CONFIG_MEDIA_CONTROLLER \
            --enable CONFIG_MEDIA_PCI_SUPPORT \
            --enable CONFIG_VIDEO_DEV \
            --enable CONFIG_I2C \
            --enable CONFIG_PMIC_OPREGION \
            --enable CONFIG_IOSF_MBI \
            --enable CONFIG_COMMON_CLK

          # 5. olddefconfig автоматически подтянет все скрытые зависимости (select/depends on)
          make olddefconfig

          # Возвращаемся в корень дерева исходников
          cd ../../../../

          echo "Checking final generated configuration:"
          for symbol in \
            CONFIG_INTEL_ATOMISP \
            CONFIG_INTEL_BYTCRC_PWRSRC \
            CONFIG_INTEL_PUNIT_IPC \
            CONFIG_VIDEO_ATOMISP \
            CONFIG_VIDEO_ATOMISP_GC2235
          do
            grep -E "^${symbol}=|^# ${symbol} is not set" "$CONFIG" || true
          done

          # INTEL_ATOMISP is a bool and must be y.
          grep -qx 'CONFIG_INTEL_ATOMISP=y' "$CONFIG"

          # These four requested drivers must be modules.
          for symbol in \
            CONFIG_INTEL_BYTCRC_PWRSRC \
            CONFIG_INTEL_PUNIT_IPC \
            CONFIG_VIDEO_ATOMISP \
            CONFIG_VIDEO_ATOMISP_GC2235
          do
            if ! grep -qx "${symbol}=m" "$CONFIG"; then
              echo "ERROR: $symbol is not enabled as a module."
              exit 1
            fi
          done

          echo "All requested driver settings are present."

      - name: Build amd64 kernel packages
        working-directory: linux-6.12.113
        shell: bash
        env:
          DEB_RULES_REQUIRES_ROOT: "no"
          DEB_BUILD_PROFILES: "pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo"
        run: |
          set -eux

          export MAKEFLAGS="-j$(nproc)"

          make -f debian/rules.gen binary-arch_amd64_none_amd64

      - name: Verify modules in generated packages
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          shopt -s nullglob

          packages=(./*.deb)

          if ((${#packages[@]} == 0)); then
            echo "WARNING: no Debian packages found."
            exit 0
          fi

          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT

          for deb in "${packages[@]}"; do
            echo "Inspecting $deb"
            if ! dpkg-deb --contents "$deb" >> "$listing"; then
              echo "WARNING: failed to inspect $deb"
            fi
          done

          for module in \
            intel_bytcrc_pwrsrc \
            intel_punit_ipc \
            atomisp \
            atomisp-gc2235
          do
            if grep -Eq "/${module}\.ko(\.(xz|zst|gz))?([[:space:]]|$)" \
              "$listing"; then
              echo "FOUND: $module"
            else
              echo "WARNING: $module not found in packages"
            fi
          done

      - name: Upload Debian kernel packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.113-debian-amd64
          path: "*.deb"
          if-no-files-found: warn
          compression-level: 0
