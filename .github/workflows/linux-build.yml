name: Build Debian 6.12.113 amd64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            build-essential \
            fakeroot \
            devscripts \
            dpkg-dev \
            debhelper \
            bc \
            bison \
            flex \
            rsync \
            kmod \
            cpio \
            xz-utils \
            zstd \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-yaml \
            python3-jinja2 \
            python3-packaging \
            wget \
            curl

      - name: Enable Debian source repositories
        shell: bash
        run: |
          set -eux

          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/' \
              /etc/apt/sources.list.d/debian.sources
          elif [ -f /etc/apt/sources.list ]; then
            sed -i 's/^deb /deb deb-src /' /etc/apt/sources.list
          fi

          apt-get update

      - name: Download Linux source
        shell: bash
        run: |
          set -eux
          apt-get source linux=6.12.113-1
          test -d linux-6.12.113

      - name: Install Linux source build dependencies
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -eux
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y linux=6.12.113-1

      - name: Configure requested drivers
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -eux

          cat > /tmp/enable-requested-drivers.py <<'PY'
          from pathlib import Path
          import re
          import sys

          configs = {
              "CONFIG_INTEL_BYTCRC_PWRSRC": "m",
              "CONFIG_INTEL_PUNIT_IPC": "m",
              "CONFIG_VIDEO_ATOMISP": "m",
              "CONFIG_VIDEO_ATOMISP_GC2235": "m",
          }

          candidates = [
              Path("debian/config/config"),
              Path("debian/config"),
          ]

          files = []
          for candidate in candidates:
              if candidate.is_file():
                  files.append(candidate)
              elif candidate.is_dir():
                  files.extend(candidate.rglob("*"))
          files = sorted(set(p for p in files if p.is_file()))

          changed = 0
          for path in files:
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              updated = text
              for key, value in configs.items():
                  pattern = rf"^(?:# )?{re.escape(key)}(?:=.*| is not set)$"
                  replacement = f"{key}={value}"
                  updated, count = re.subn(
                      pattern, replacement, updated, flags=re.MULTILINE
                  )
                  changed += count

              if updated != text:
                  path.write_text(updated)

          print(f"Updated {changed} existing config entries.")
          print("Note: this does not add symbols absent from Debian config files.")
          PY

          python3 /tmp/enable-requested-drivers.py

          echo "Checking whether the requested symbols exist in the source:"
          for symbol in \
            CONFIG_INTEL_BYTCRC_PWRSRC \
            CONFIG_INTEL_PUNIT_IPC \
            CONFIG_VIDEO_ATOMISP \
            CONFIG_VIDEO_ATOMISP_GC2235
          do
            if grep -R -l --include='Kconfig*' --include='*.Kconfig' \
              "$symbol" drivers 2>/dev/null | head -n 1; then
              echo "Kconfig reference found for $symbol"
            else
              echo "WARNING: no Kconfig reference found for $symbol"
            fi
          done

      - name: Generate Debian source rules
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -eux
          debian/rules source

      - name: Build amd64 kernel packages
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -eux
          make -f debian/rules.gen binary-arch_amd64_none_amd64

      - name: Build architecture-independent packages
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -eux
          make -f debian/rules.gen binary-indep_none

      - name: Verify requested modules in Debian packages
        if: always()
        continue-on-error: true
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -u
          shopt -s nullglob

          packages=(../*.deb)

          if ((${#packages[@]} == 0)); then
            echo "WARNING: no Debian packages found; skipping module verification"
            exit 0
          fi

          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT

          for deb in "${packages[@]}"; do
            echo "Inspecting package: $deb"
            if ! dpkg-deb --contents "$deb" >> "$listing"; then
              echo "WARNING: could not inspect $deb"
            fi
          done

          echo "Matching module paths:"
          grep -Ei 'bytcrc|punit|atomisp|gc2235' "$listing" || true

          for module in \
            intel_bytcrc_pwrsrc \
            intel_punit_ipc \
            atomisp \
            atomisp-gc2235
          do
            if grep -Eq "/${module}\.ko(\.(xz|zst|gz))?([[:space:]]|$)" "$listing"; then
              echo "FOUND: $module"
            else
              echo "WARNING: $module not found in Debian packages"
            fi
          done

          echo "Module verification finished without failing the job."

      - name: Upload Debian packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.113-debian-amd64
          path: "linux-6.12.113/../*.deb"
          if-no-files-found: warn
          compression-level: 0
