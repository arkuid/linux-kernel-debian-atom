
name: Build Debian Linux 6.12.113 amd64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - name: Install tools and Debian source repositories
        run: |
          cat > /etc/apt/sources.list.d/debian.sources <<'EOF'
          Types: deb deb-src
          URIs: https://deb.debian.org/debian
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb deb-src
          URIs: https://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOF

          apt-get update
          apt-get install -y build-essential devscripts \
            dpkg-dev fakeroot bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            dwarves rsync python3 python3-yaml \
            kmod cpio xz-utils

          apt-get build-dep -y linux=6.12.113-1

      - name: Download Debian kernel source
        run: |
          apt-get source linux=6.12.113-1
          test -d linux-6.12.113

      - name: Set module configuration
        working-directory: linux-6.12.113
        run: |
          cat > debian/config.local <<'EOF'
          CONFIG_INTEL_BYTCRC_PWRSRC=m
          CONFIG_INTEL_PUNIT_IPC=m
          CONFIG_VIDEO_ATOMISP=m
          CONFIG_VIDEO_ATOMISP_GC2235=m
          EOF

          debian/rules source

      - name: Build amd64 kernel packages
        working-directory: linux-6.12.113
        env:
          DEB_BUILD_PROFILES: pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo
          MAKEFLAGS: -j2
        run: |
          DEB_RULES_REQUIRES_ROOT=no \
            make -f debian/rules.gen binary-arch_amd64_none_amd64

          DEB_RULES_REQUIRES_ROOT=no \
            make -f debian/rules.gen binary-indep_none

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.113-debian-amd64
          path: "*.deb"
          if-no-files-found: error
          compression-level: 0
