name: Build Debian Linux 6.12.113 amd64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - name: Install tools and Debian source repositories
        shell: bash
        run: |
          set -euxo pipefail

          cat > /etc/apt/sources.list.d/debian.sources <<'EOF'
          Types: deb deb-src
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb deb-src
          URIs: http://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOF

          apt-get update
          apt-get install -y ca-certificates
          apt-get install -y \
            build-essential devscripts dpkg-dev fakeroot \
            bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves rsync python3 \
            python3-yaml kmod cpio xz-utils \
            file git

          apt-get build-dep -y linux=6.12.113-1

      - name: Download Debian kernel source
        shell: bash
        run: |
          set -euxo pipefail

          apt-get source linux=6.12.113-1

          test -d linux-6.12.113

      - name: Inspect driver Kconfig definitions
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -euxo pipefail

          grep -R -n -E \
            'config (INTEL_BYTCRC_PWRSRC|INTEL_PUNIT_IPC|VIDEO_ATOMISP|VIDEO_ATOMISP_GC2235)( |$)' \
            drivers/

      - name: Configure required kernel drivers
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -euxo pipefail

          # Add the requested settings to Debian's amd64 config fragment.
          CONFIG_FRAGMENT="debian/config/amd64/config"
          test -f "$CONFIG_FRAGMENT"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("debian/config/amd64/config")

          settings = {
              "CONFIG_ACPI": "y",
              "CONFIG_I2C": "y",
              "CONFIG_GPIOLIB": "y",
              "CONFIG_COMMON_CLK": "y",
              "CONFIG_POWER_SUPPLY": "y",
              "CONFIG_INTEL_SOC_PMIC": "y",
              "CONFIG_INTEL_BYTCRC_PWRSRC": "m",
              "CONFIG_INTEL_PUNIT_IPC": "m",
              "CONFIG_MEDIA_SUPPORT": "y",
              "CONFIG_MEDIA_CONTROLLER": "y",
              "CONFIG_VIDEO_DEV": "y",
              "CONFIG_STAGING": "y",
              "CONFIG_INTEL_ATOMISP": "y",
              "CONFIG_PMIC_OPREGION": "y",
              "CONFIG_VIDEO_ATOMISP": "m",
              "CONFIG_VIDEO_ATOMISP_GC2235": "m",
          }

          lines = path.read_text().splitlines()

          patterns = [
              re.compile(
                  rf"^(?:{re.escape(key)}=.*|"
                  rf"# {re.escape(key)} is not set)$"
              )
              for key in settings
          ]

          lines = [
              line for line in lines
              if not any(pattern.match(line) for pattern in patterns)
          ]

          lines.extend([
              "",
              "# Required custom kernel modules",
              *[f"{key}={value}" for key, value in settings.items()],
          ])

          path.write_text("\n".join(lines) + "\n")
          PY

          # Prepare Debian's kernel source and configuration.
          debian/rules source

      - name: Verify final kernel configuration
        working-directory: linux-6.12.113
        env:
          DEB_BUILD_PROFILES: pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo
        shell: bash
        run: |
          set -euxo pipefail

          make -f debian/rules.gen setup_amd64_none_amd64

          CONFIG="debian/build/build_amd64_none_amd64/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: expected kernel config not found: $CONFIG"
            find debian/build -name .config -print
            exit 1
          fi

          for option in \
            CONFIG_INTEL_BYTCRC_PWRSRC \
            CONFIG_INTEL_PUNIT_IPC \
            CONFIG_VIDEO_ATOMISP \
            CONFIG_VIDEO_ATOMISP_GC2235
          do
            if ! grep -qx "${option}=m" "$CONFIG"; then
              echo "ERROR: $option is not enabled as a module"
              grep -E "^${option}=|^# ${option} is not set" \
                "$CONFIG" || true
              exit 1
            fi

            echo "OK: ${option}=m"
          done

      - name: Build amd64 kernel packages
        working-directory: linux-6.12.113
        env:
          DEB_BUILD_PROFILES: pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo
          MAKEFLAGS: -j2
        shell: bash
        run: |
          set -euxo pipefail

          DEB_RULES_REQUIRES_ROOT=no \
            make -f debian/rules.gen binary-arch_amd64_none_amd64

          DEB_RULES_REQUIRES_ROOT=no \
            make -f debian/rules.gen binary-indep_none

      - name: Verify all requested modules in Debian packages
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(../*.deb)

          if ((${#packages[@]} == 0)); then
            echo "ERROR: no Debian packages found"
            exit 1
          fi

          for module in \
            intel_bytcrc_pwrsrc \
            intel_punit_ipc \
            atomisp \
            atomisp-gc2235
          do
            found=0

            for deb in "${packages[@]}"; do
              if dpkg-deb -c "$deb" |
                grep -Eq "/${module}\.ko(\.(xz|zst|gz))?([[:space:]]|$)"; then
                echo "FOUND: $module in $deb"
                found=1
                break
              fi
            done

            if [ "$found" -ne 1 ]; then
              echo "ERROR: $module.ko missing from all Debian packages"
              exit 1
            fi
          done

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.113-debian-amd64
          path: linux-6.12.113/../*.deb
          if-no-files-found: error
          compression-level: 0
