name: Build Debian Kernel 6.12.113 amd64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build kernel and requested modules
    runs-on: ubuntu-latest
    timeout-minutes: 360

    container:
      image: debian:trixie

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i '/^Types:/ s/\bdeb-src\b//g; /^Types:/ s/$/ deb-src/' \
              /etc/apt/sources.list.d/debian.sources
          elif [ -f /etc/apt/sources.list ]; then
            sed -i '/^deb /s/^deb /deb-src /' /etc/apt/sources.list
          fi

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            devscripts \
            dpkg-dev \
            fakeroot \
            debhelper \
            bc \
            bison \
            flex \
            rsync \
            kmod \
            cpio \
            xz-utils \
            zstd \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-yaml \
            python3-jinja2 \
            python3-packaging

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -eux
          DEBIAN_FRONTEND=noninteractive \
            apt-get build-dep -y linux=6.12.113-1

      - name: Download kernel source
        shell: bash
        run: |
          set -eux
          apt-get source linux=6.12.113-1
          test -d linux-6.12.113

      - name: Set requested kernel modules
        working-directory: linux-6.12.113
        shell: bash
        run: |
          set -eux

          cat > debian/config.local <<'EOF'
          CONFIG_INTEL_BYTCRC_PWRSRC=m
          CONFIG_INTEL_PUNIT_IPC=m
          CONFIG_VIDEO_ATOMISP=m
          CONFIG_VIDEO_ATOMISP_GC2235=m
          EOF

          make -f debian/rules source
          DEB_RULES_REQUIRES_ROOT=no \
            make -f debian/rules.gen setup_amd64_none_amd64

          CONFIG_FILE="debian/build/build_amd64_none_amd64/.config"
          test -f "$CONFIG_FILE"

          echo "Checking requested symbols in the generated config:"
          for symbol in \
            CONFIG_INTEL_BYTCRC_PWRSRC \
            CONFIG_INTEL_PUNIT_IPC \
            CONFIG_VIDEO_ATOMISP \
            CONFIG_VIDEO_ATOMISP_GC2235
          do
            if ! grep -qx "${symbol}=m" "$CONFIG_FILE"; then
              echo "ERROR: $symbol is not enabled as a module."
              grep -E "^(${symbol}=|# ${symbol} is not set)" \
                "$CONFIG_FILE" || true
              exit 1
            fi
          done

          echo "All requested modules are enabled."

      - name: Build only amd64 kernel flavour packages
        working-directory: linux-6.12.113
        shell: bash
        env:
          DEB_RULES_REQUIRES_ROOT: "no"
          DEB_BUILD_PROFILES: "pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo"
        run: |
          set -eux
          export MAKEFLAGS="-j$(nproc)"

          make -f debian/rules.gen binary-arch_amd64_none_amd64

      - name: Verify modules in generated packages
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          shopt -s nullglob

          packages=(linux-6.12.113/../*.deb)

          if ((${#packages[@]} == 0)); then
            echo "WARNING: no Debian packages found."
            exit 0
          fi

          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT

          for deb in "${packages[@]}"; do
            echo "Inspecting $deb"
            if ! dpkg-deb --contents "$deb" >> "$listing"; then
              echo "WARNING: failed to inspect $deb"
            fi
          done

          for module in \
            intel_bytcrc_pwrsrc \
            intel_punit_ipc \
            atomisp \
            atomisp-gc2235
          do
            if grep -Eq "/${module}\.ko(\.(xz|zst|gz))?([[:space:]]|$)" \
              "$listing"; then
              echo "FOUND: $module"
            else
              echo "WARNING: $module not found in packages"
            fi
          done

      - name: Upload kernel packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.113-debian-amd64
          path: "linux-6.12.113/../*.deb"
          if-no-files-found: warn
          compression-level: 0
